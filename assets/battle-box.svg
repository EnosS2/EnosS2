  <clipPath id="box"><rect x="10" y="10" width="580" height="158"/></clipPath>

  <rect x="5" y="5" width="590" height="168"
        fill="#000000" stroke="#FFFFFF" stroke-width="5"/>

  <!-- clip and translate must sit on separate groups: a clipPath on the same
       element as a transform is resolved in the transformed space, which
       offsets the clip window and lets bullets escape past the border -->
